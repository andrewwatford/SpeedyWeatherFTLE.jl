name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Build package
        run: julia --color=yes --project=@. -e 'using Pkg; Pkg.build(verbose=true)'
      - name: Run tests
        run: julia --color=yes --project=@. -e 'using Pkg; Pkg.test(coverage=true)'

  fresh-core-smoke:
    name: Fresh core smoke - Julia 1.12 - ubuntu-latest - x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run fresh compute-only install smoke
        run: |
          julia --color=yes -e '
            using Pkg

            project = mktempdir()
            Pkg.activate(project)

            speedyweather_url = "https://github.com/SpeedyWeather/SpeedyWeather.jl"
            Pkg.add([
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "LowerTriangularArrays"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "RingGrids"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyTransforms"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyWeather"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyWeatherInternals"),
            ])
            Pkg.add(PackageSpec(path = pwd()))

            using SpeedyWeatherFTLE

            manifest_names = Set(pkg.name for pkg in values(Pkg.dependencies()))
            @assert !("Makie" in manifest_names)
            @assert !("GeoMakie" in manifest_names)

            loaded_names = Set(string(pkg.name) for pkg in keys(Base.loaded_modules))
            @assert !("Makie" in loaded_names)
            @assert !("GeoMakie" in loaded_names)

            dist_km = 10.0
            delta = rad2deg(dist_km * 1000 / SpeedyWeatherFTLE.Re)
            plonds_time = [
                 delta      2delta
                -delta     -2delta
                 0.0        0.0
                 0.0        0.0
            ]
            platds_time = [
                 0.0        0.0
                 0.0        0.0
                 delta      2delta
                -delta     -2delta
            ]
            ftle, selected = FTLE_from_particles(
                plonds_time,
                platds_time,
                [0.0, 2.0],
                1,
                dist_km;
                time_indices = :nonzero,
            )

            @assert selected == [2.0]
            @assert size(ftle) == (1, 1)
            @assert isfinite(only(ftle))
          '

  fresh-cairo-smoke:
    name: Fresh CairoMakie smoke - Julia 1.12 - ubuntu-latest - x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run fresh Cairo plotting smoke
        run: |
          julia --color=yes -e '
            using Pkg

            project = mktempdir()
            Pkg.activate(project)

            speedyweather_url = "https://github.com/SpeedyWeather/SpeedyWeather.jl"
            Pkg.add([
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "LowerTriangularArrays"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "RingGrids"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyTransforms"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyWeather"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyWeatherInternals"),
            ])
            Pkg.add(PackageSpec(path = pwd()))
            Pkg.add([
                PackageSpec(name = "CairoMakie"),
                PackageSpec(name = "GeoMakie"),
            ])

            using CairoMakie, GeoMakie, Random, RingGrids, SpeedyWeatherFTLE

            CairoMakie.activate!()
            Random.seed!(42)

            grid = FullGaussianGrid(8)
            field = rand(grid)
            fig, ax, sp, cb = surface_plot(
                field;
                lon = -180:30:180,
                lat = -90:30:90,
                coastlines = false,
                colorbar = false,
            )
            @assert fig !== nothing
            @assert cb === nothing

            using Test
            visualization_tests = joinpath(pwd(), "test", "visualization")
            include(joinpath(visualization_tests, "surface_plot.jl"))
            include(joinpath(visualization_tests, "slider_plot.jl"))
            include(joinpath(visualization_tests, "globe.jl"))
          '

  fresh-glmakie-smoke:
    name: Fresh GLMakie smoke - Julia 1.12 - ubuntu-latest - x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Install headless display support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Run fresh GLMakie plotting smoke
        run: |
          xvfb-run -a julia --color=yes -e '
            using Pkg

            project = mktempdir()
            Pkg.activate(project)

            speedyweather_url = "https://github.com/SpeedyWeather/SpeedyWeather.jl"
            Pkg.add([
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "LowerTriangularArrays"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "RingGrids"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyTransforms"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyWeather"),
                PackageSpec(url = speedyweather_url, rev = "mk/lyapunov2", subdir = "SpeedyWeatherInternals"),
            ])
            Pkg.add(PackageSpec(path = pwd()))
            Pkg.add([
                PackageSpec(name = "GLMakie"),
                PackageSpec(name = "GeoMakie"),
            ])

            using GLMakie, GeoMakie, Random, RingGrids, SpeedyWeather, SpeedyWeatherFTLE

            GLMakie.activate!()
            Random.seed!(42)

            spectral_grid = SpectralGrid(nlayers = 1, trunc = 6, Grid = FullGaussianGrid)
            ftle = rand(spectral_grid.npoints, 3)
            ftle[:, 1] .= NaN
            result = FTLEResult(
                ftle,
                spectral_grid,
                [0.0, 6.0, 12.0];
                dist_km = 10,
                backwards = false,
                dynamics = false,
                rint_hours = 6,
            )

            handle = slider_plot(
                result;
                return_handle = true,
                coastlines = false,
                colorbar = false,
            )
            @assert handle.fig !== nothing
            @assert handle.times == [6.0, 12.0]
            display(handle.fig)

            fig, ax, sp, cb = globe_plot(
                result;
                lon = collect(-180:60:180),
                lat = collect(-90:45:90),
                coastlines = false,
                colorbar = false,
            )
            @assert fig !== nothing
            @assert cb === nothing
            display(fig)
          '
